services:
  gost:
    container_name: gost
    image: ginuerzh/gost:latest
    network_mode: host
    restart: unless-stopped
    command:
      # For Rocket League (point to local Tailscale IP)
      - "-L=udp://:7777/100.105.54.64:7777"

      # For Insurgency Sandstorm (point to Ally Tailscale IP)
      - "-L=tcp://:27102/100.123.114.55:27102"
      - "-L=udp://:27102/100.123.114.55:27102"
      - "-L=tcp://:27131/100.123.114.55:27131"
      - "-L=udp://:27131/100.123.114.55:27131"
      # Zombie mode
      - "-L=tcp://:27103/100.123.114.55:27103"
      - "-L=udp://:27103/100.123.114.55:27103"
      - "-L=tcp://:27132/100.123.114.55:27132"
      - "-L=udp://:27132/100.123.114.55:27132"

      # For PZ (point to Ally Tailscale IP)
      - "-L=udp://:16261/100.123.114.55:16261"
      - "-L=udp://:16262/100.123.114.55:16262"
